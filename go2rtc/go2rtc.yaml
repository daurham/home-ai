# LAN-only POE camera restream. Credentials come from CAMERA_PASSWORD env.
# Camera output is HEVC (despite /h264 path). Transcode to H.264 for browsers.

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  ice_servers: []

ffmpeg:
  # ultrafast/zerolatency: 4K HEVC -> 1920px H.264 needs headroom vs ollama
  h264: "-codec:v libx264 -g:v 40 -preset:v ultrafast -tune:v zerolatency -profile:v baseline -level:v 4.0"

log:
  level: info
  format: text

streams:
  poe-1:
    ffmpeg:rtsp://admin:${CAMERA_PASSWORD}@192.168.1.72:554/h264#video=h264#audio=aac#width=1920#height=912
