services:
  postgres:
    image: postgres:16-alpine
    container_name: home-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeai_password}
      POSTGRES_DB: ${POSTGRES_DB:-homeai}
    ports:
      - "5433:5432"  # Use 5433 on host to avoid conflict with host PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: home-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  node-api:
    build: ./node-api
    container_name: home-ai-node-api
    ports:
      - "3000:3000"
    env_file:
      - ./node-api/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-homeai}:${POSTGRES_PASSWORD:-homeai_password}@home-ai-postgres:5432/${POSTGRES_DB:-homeai}
      # Compose DNS — overrides a localhost OLLAMA_URL from .env (that would miss the ollama container).
      - OLLAMA_URL=http://home-ai-ollama:11434/api/generate
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build: ./home-dashboard
    container_name: home-ai-dashboard
    ports:
      - "8080:8080"
    volumes:
      - ./home-dashboard:/usr/src/app
      - dashboard_node_modules:/usr/src/app/node_modules
    command:
      [
        "sh",
        "-c",
        "if [ ! -x node_modules/.bin/vite ]; then npm install; fi; exec npm run dev -- --host 0.0.0.0 --port 8080",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      node-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/dashboard/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: home-ai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dashboard:
        condition: service_healthy
      node-api:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
  dashboard_node_modules:
