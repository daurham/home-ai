name: Music Studio checks
on:
  pull_request:
    paths:
      - "services/audio-generation/**"
      - ".github/workflows/music-studio-checks.yml"
  push:
    branches:
      - music-studio-library-polish
    paths:
      - "services/audio-generation/**"
      - ".github/workflows/music-studio-checks.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: node --check services/audio-generation/audio_studio/studio_web/studio.js
      - name: Install lightweight Google Drive test dependency
        run: python -m pip install google-api-python-client
      - name: Audio service unit and integration tests (fake backend)
        env:
          PYTHONPATH: services/audio-generation
        run: python -m unittest discover -s services/audio-generation/tests -p 'test_*.py' -v
